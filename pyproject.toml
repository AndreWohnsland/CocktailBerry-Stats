[project]
name = "cocktailberry-stats"
version = "2.0.0"
description = "WebApp with API and endpoint for CocktailBerry. Have insights into made cocktails."
authors = [{name="Andre Wohnsland", email="<50302161+AndreWohnsland@users.noreply.github.com>"}]
license = "MIT"
requires-python = ">=3.14,<3.15"

dependencies = [
    "pandas>=3.0.5,<4",
    "plotly>=7.0.0",
    "pydantic-settings>=2.15.0",
    "requests>=2.34.2",
    "streamlit>=1.63.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "jupyterlab>=4.6.3",
    "pandas-stubs>=3.0.5.260730",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
    "ty==0.0.78",
]

[tool.ty.environment]
# tests import the backend modules flat (from models import ...), like the backend itself does
extra-paths = ["backend"]

[tool.pytest.ini_options]
# backend uses flat imports (from models import ...), so it needs to be on the path
pythonpath = [".", "backend"]
# -ra always shows the reasons for skipped and failed tests
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["mongo: needs a running mongodb (docker compose up -d mongo in backend)"]

[tool.uv.workspace]
members = ["backend"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
extend-safe-fixes = [
  "UP", # pyupgrade
  "D107", # Missing docstring in __init__
  "D205", # 1 blank line required between summary line and description
  "W291", # Trailing whitespace
  ]
select = [
  "A", # flake8-builtins
  "ANN", # Type annotations
  "C", # Convention
  "C4", # flake-comprehensions
  "D", # pydocstyle 
  "E", # pycodestyle
  "F", # Pyflakes
  "FAST", # FastAPI
  "I", # isort 
  "ICN001", # {name} should be imported as {asname},
  "PIE", # flake8-pie
  "PL", # pylint
  "PTH", # flake8-use-pathlib
  "PYI", # flake8-pyi
  "Q", # flake8-quotes
  "R", # Refactor
  "RET", # flake8-return
  "RUF", # Ruff
  "SIM", # flake8-simplify
  "UP", # pyupgrade
  "W", # Pylint (Warning)
]
ignore = [
  "D100", # Missing docstring in public module
  "D101", # Missing docstring in public class
  "D102", # Missing docstring in public method
  "D103",  # Missing docstring in public function
  "D104", # Missing docstring in public package
  "D105", # Missing docstring in magic method
  "D107", # Missing docstring in __init__
  "D203", # 1 blank line required before class docstring
  "D213", # Multi-line docstring summary should start at the second line
  "ANN401", # no Any for *args or **kwargs
  "PLR0913", # Too many arguments
  "PLR0917", # Too many positional arguments
  "PLC0415", # `import` should be at the top-level of a file
]

[tool.ruff.lint.per-file-ignores]
# test names document themselves, fixtures stay untyped, asserts use literal values
"tests/*" = ["ANN", "D", "E402", "PLR2004"]

